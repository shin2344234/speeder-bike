; Speeder Bike for Crimson Desert 2.03.02 (exe 1.0.0.2976).
;
; A speeder bike that rides on the ground, in the saddle wedge with the horses.
; It runs beside Broomy if that is installed too. The plugin writes what it
; does to SpeederBike.log, next to it in bin64. The sessions before it are
; SpeederBike.01.log upwards, newest first.

;@mod name="Speeder Bike" author=Seth live=0

[settings]

; Give the speeder to a save that does not have it yet. A few seconds after
; a save loads, the plugin looks for the speeder among your mounts; when it
; is not there, the next unowned wild horse nearby joins as the speeder.
; Read at startup.
;@ type=bool true=1 false=0 label="Give the speeder"
GiveSpeeder=1

; The speeder's speed, in percent of the Wyvern's on the ground. At 100 it
; walks at 5.6 m/s and runs at 11; the default 350 runs at 38.5 m/s, about
; 140 km/h. Read at startup.
;@ type=int min=10 max=1000 label="Speed (% of the Wyvern's on the ground)"
GroundSpeed=350

; On a controller, the speeder's speed follows how far the left stick is
; pushed: the lightest push moves at this percent of the full speed, and
; pushing all the way gives the full speed. 100 keeps one speed whatever the
; push. The keyboard always moves at full speed. Read at startup.
;@ type=int min=5 max=100 label="Speed at the lightest stick push (%)"
SlowestPush=15

; The speeder's engine sound, in percent. It plays while you ride and rises
; with the speed. 0 turns it off. Read at startup.
;@ type=int min=0 max=100 label="Engine volume (%)"
EngineVolume=60
